name: second pipeline
on: push

jobs: 
    job1:
        runs-on: ubuntu-latest
        steps:
            - name: checkout code
              uses: actions/checkout@v5
            - name: locate the path
              run: pwd; ls

    jobs2:
        runs-on: ubuntu-latest
        needs: job1
        steps:
            - name: locate the path and list
              uses: actions/setup-node@v6
              run: node --version
        
    