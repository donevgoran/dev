name: second pipeline
on:
  push

jobs: 
    job1:
        runs-on: ubuntu-latest
        outputs:
          job1: ${{ steps.node_version.outputs.npm_version}}"
        steps:
            - name: checkout code
              uses: actions/checkout@v5
            - name: locate the path
              run: pwd; ls
            - name: using nodejs
              uses: actions/setup-node@v6
            - name: check node version
              id: node_version
              run: echo "npm_version=$(npm --version)" >> $GITHUB_OUTPUT
            - name: check node version from output
              run: echo "the node version is ${{ steps.node_version.outputs.npm_version}}"

    job2:
        runs-on: ubuntu-latest
        needs: job1
        steps:
            - name: job3
              run: echo "goran and node version is: ${{ needs.job1.outputs.job1 }}"
    
        
    
