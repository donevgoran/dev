name: second pipeline
on:
  push

jobs: 
    job1:
        runs-on: ubuntu-latest
        steps:
            - name: checkout code
              uses: actions/checkout@v5
            - name: locate the path
              run: pwd; ls
            - name: using nodejs
              uses: actions/setup-node@v6
            - name: check node version
              id: node_version
              run: echo "npm_version=$(npm --version)" >> $GITHUB_OUTPUT
            - name: check node version from output
              run: echo "the node version is ${{ steps.node_version.outputs.name}}"

    job2:
        runs-on: ubuntu-latest
        steps:
            - name: locate the path and list
              uses: actions/setup-node@v6
            - name: check node version
              run: ls; pwd
    
    jobs:
        runs-on: ubuntu-latest
        needs: [job1, job2]
        steps:
            - name: job3
              run: echo goran
    
        
    
